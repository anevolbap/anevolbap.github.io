name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Emacs and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox texlive-latex-base lmodern

      - name: Build the site
        shell: bash
        run: make publish 2>&1 | tee build.log

      - name: Show the LaTeX log
        if: failure()
        run: cat org/resume.log || true

      - name: Check the output
        run: |
          ! grep -q 'produced with errors' build.log
          test -f _site/index.html
          test -f _site/resume.html
          test -f _site/resume.pdf
          test ! -e _site/resume.tex
          test -f _site/style.css
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
